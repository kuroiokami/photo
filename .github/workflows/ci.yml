name: Swift checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          swift --version
          swift format --version
      - name: Format, build, and test
        run: sh scripts/check.sh
